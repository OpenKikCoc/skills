<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blank slide template</title>
  <style>
    /* House palette. Every slide redeclares these — slides are isolated
       documents, so this never collides with a sibling slide's :root. */
    :root {
      --page-bg: #ffffff;
      --grid-line: rgba(148, 163, 184, 0.12);
      --surface: #ffffff;
      --ink: #0f172a;          /* near-black text */
      --muted: #64748b;        /* secondary text */
      --line: #d7e0ea;         /* hairline borders */
      --accent-a: #1677c8;     /* blue — first narrative path */
      --accent-b: #5b5bd6;     /* indigo — second narrative path */
      --accent-ok: #249c62;    /* green — outcomes / convergence */
      --accent-warn: #d97706;  /* amber — queues / caution */
      --mono: "Cascadia Code", "Cascadia Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background: var(--page-bg);
    }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    button { font: inherit; }

    /* Fixed chrome rows top and bottom; the diagram viewport takes the rest. */
    .page {
      height: 100vh;
      display: grid;
      grid-template-rows: 66px minmax(0, 1fr) 86px;
    }

    .topbar, .controlbar {
      display: flex;
      align-items: center;
      padding: 0 30px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      border-color: rgba(148, 163, 184, 0.22);
      z-index: 5;
    }
    .topbar { gap: 16px; border-bottom: 1px solid; }
    .controlbar { gap: 10px; border-top: 1px solid; }

    .eyebrow {
      color: var(--accent-b);
      border: 1px solid rgba(91, 91, 214, 0.32);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      white-space: nowrap;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -.02em;
      color: var(--ink);
      white-space: nowrap;
    }
    .subtitle {
      margin-left: auto;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    /* The stage is a fixed 1600x900 composition; fitStage() scales it to the
       viewport. Position everything inside #stage absolutely, in stage px. */
    .viewport {
      min-height: 0;
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .stage-shell { position: relative; }
    #stage {
      position: absolute;
      width: 1600px;
      height: 900px;
      transform-origin: top left;
      background: var(--page-bg);
    }

    /* Placeholder content — replace everything inside #stage. */
    .placeholder {
      position: absolute;
      left: 500px;
      top: 330px;
      width: 600px;
      height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 2px dashed var(--line);
      border-radius: 18px;
      background: var(--surface);
      transition: opacity .22s ease, transform .22s ease, box-shadow .22s ease;
    }
    .placeholder strong { font-size: 24px; letter-spacing: -.02em; }
    .placeholder span { color: var(--muted); font-size: 15px; }
    [data-node].is-active {
      transform: translateY(-4px);
      box-shadow: 0 0 0 3px rgba(91, 91, 214, .18), 0 14px 30px rgba(15, 23, 42, .12);
    }
    [data-node].is-muted { opacity: .2; }

    .controlbar button {
      min-width: 84px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: var(--surface);
      cursor: pointer;
    }
    .controlbar button:hover,
    .controlbar button:focus-visible { border-color: var(--accent-b); outline: none; }
    .controlbar button:disabled { opacity: .38; cursor: default; }
    .step-copy { margin-left: 14px; min-width: 0; }
    #step-title { font-size: 16px; font-weight: 700; color: var(--ink); }
    #step-detail { margin-top: 3px; color: var(--muted); font-size: 14px; }
    .progress {
      margin-left: auto;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar" role="banner">
      <span class="eyebrow">00 · SECTION</span>
      <h1>Slide title goes here</h1>
      <span class="subtitle">One-line summary of what this slide argues</span>
    </header>

    <section class="viewport" id="viewport" aria-label="Diagram viewport">
      <div class="stage-shell" id="stage-shell">
        <div id="stage" role="img" aria-label="Describe the diagram for screen readers">
          <article class="placeholder" data-node="placeholder">
            <strong>1600 &times; 900 stage</strong>
            <span>Replace this box with your diagram. Absolute positions, stage pixels.</span>
          </article>
        </div>
      </div>
    </section>

    <footer class="controlbar">
      <button id="prev-step" type="button" aria-label="Previous step">Previous</button>
      <button id="next-step" type="button" aria-label="Next step">Next</button>
      <button id="play-toggle" type="button" aria-label="Play narrative">Play</button>
      <button id="reset-view" type="button" aria-label="Reset diagram">Reset</button>
      <div class="step-copy">
        <div id="step-title" role="status" aria-live="polite" aria-atomic="true">Overview</div>
        <div id="step-detail">Step detail copy goes here.</div>
      </div>
      <div class="progress" id="progress" aria-live="polite">0 / 1</div>
    </footer>
  </main>

  <script>
  (function () {
    'use strict';

    var STAGE_W = 1600, STAGE_H = 900;

    /* One entry per build step. Step 0 is the resting overview state.
       `nodes` lists the data-node ids highlighted by that step; everything
       else on the stage is muted while any step has focus. */
    const STEPS = [
      {
        title: 'Overview',
        detail: 'Step detail copy goes here.',
        nodes: [],
      },
      {
        title: '1 · First build step',
        detail: 'Describe what this step reveals.',
        nodes: ['placeholder'],
      },
    ];

    let currentStep = 0;
    let playTimer = null;

    /* Scale the fixed-size stage to whatever viewport the shell hands us. */
    function fitStage() {
      const viewport = document.getElementById('viewport');
      const stage = document.getElementById('stage');
      const shell = document.getElementById('stage-shell');
      const scale = Math.min(viewport.clientWidth / STAGE_W, viewport.clientHeight / STAGE_H);
      stage.style.transform = 'scale(' + scale + ')';
      shell.style.width = (STAGE_W * scale) + 'px';
      shell.style.height = (STAGE_H * scale) + 'px';
    }

    function applyStep(index) {
      currentStep = Math.max(0, Math.min(index, STEPS.length - 1));
      const step = STEPS[currentStep];
      const focused = step.nodes.length > 0;

      document.querySelectorAll('[data-node]').forEach((node) => {
        const active = step.nodes.includes(node.dataset.node);
        node.classList.toggle('is-active', active);
        node.classList.toggle('is-muted', focused && !active);
      });

      document.getElementById('step-title').textContent = step.title;
      document.getElementById('step-detail').textContent = step.detail;
      document.getElementById('progress').textContent = currentStep + ' / ' + (STEPS.length - 1);
      document.getElementById('prev-step').disabled = currentStep === 0;
      document.getElementById('next-step').disabled = currentStep === STEPS.length - 1;
    }

    function stopPlaying() {
      clearInterval(playTimer);
      playTimer = null;
      const button = document.getElementById('play-toggle');
      button.textContent = 'Play';
      button.setAttribute('aria-label', 'Play narrative');
    }

    document.getElementById('prev-step').addEventListener('click', () => {
      stopPlaying();
      applyStep(currentStep - 1);
    });

    document.getElementById('next-step').addEventListener('click', () => {
      stopPlaying();
      applyStep(currentStep + 1);
    });

    document.getElementById('play-toggle').addEventListener('click', () => {
      if (playTimer) { stopPlaying(); return; }
      const button = document.getElementById('play-toggle');
      button.textContent = 'Pause';
      button.setAttribute('aria-label', 'Pause narrative');
      playTimer = setInterval(() => {
        if (currentStep >= STEPS.length - 1) {
          stopPlaying();
          return;
        }
        applyStep(currentStep + 1);
      }, 1800);
    });

    document.getElementById('reset-view').addEventListener('click', () => {
      stopPlaying();
      applyStep(0);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
        stopPlaying();
        applyStep(currentStep + 1);
      } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
        stopPlaying();
        applyStep(currentStep - 1);
      } else if (event.key === ' ') {
        event.preventDefault();
        document.getElementById('play-toggle').click();
      } else if (event.key === 'r' || event.key === 'R') {
        stopPlaying();
        applyStep(0);
      }
    });

    window.addEventListener('resize', fitStage);
    window.addEventListener('load', () => {
      applyStep(0);
      fitStage();
    });

    applyStep(0);
    fitStage();
  })();
  </script>

<!-- deck-bridge:v1 — lets the deck shell drive this slide's builds over
     postMessage. Inert when the slide is opened standalone. Copy verbatim
     into every slide; see reference/bridge.md for the protocol. -->
<script>
(function () {
  'use strict';
  if (window.parent === window) return;   // opened directly: do nothing at all

  var NAV = {
    ArrowRight: 1, ArrowLeft: 1, ArrowUp: 1, ArrowDown: 1, PageDown: 1, PageUp: 1,
    Home: 1, End: 1, ' ': 1, Spacebar: 1, Escape: 1, '?': 1,
    o: 1, O: 1, n: 1, N: 1, f: 1, F: 1, p: 1, P: 1, r: 1, R: 1,
    '0': 1, '1': 1, '2': 1, '3': 1, '4': 1, '5': 1, '6': 1, '7': 1, '8': 1, '9': 1
  };

  function $(id) { return document.getElementById(id); }
  var next = $('next-step'), prev = $('prev-step'), play = $('play-toggle'),
      reset = $('reset-view'), progress = $('progress');

  function send(msg) { try { parent.postMessage(msg, '*'); } catch (e) {} }

  function report() {
    var m = /(\d+)\s*\/\s*(\d+)/.exec(progress ? (progress.textContent || '') : '');
    send({
      type: 'slide:state',
      hasSteps: !!next,
      step: m ? +m[1] : 0,
      total: m ? +m[2] : 0,
      atStart: prev ? !!prev.disabled : true,
      atEnd: next ? !!next.disabled : true
    });
  }

  // The slide repaints on the next frame; report once it has settled.
  function reportSoon() {
    requestAnimationFrame(function () { requestAnimationFrame(report); });
  }

  function click(btn) { if (btn && !btn.disabled) { btn.click(); reportSoon(); } }

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || typeof d !== 'object') return;
    switch (d.type) {
      case 'deck:next':  click(next); break;
      case 'deck:prev':  click(prev); break;
      case 'deck:play':  click(play); break;
      case 'deck:reset': click(reset); break;
      case 'deck:pause':
        if (play && /pause|stop/i.test(play.textContent || '')) click(play);
        break;
      case 'deck:fit':
        window.dispatchEvent(new Event('resize'));
        reportSoon();
        break;
      case 'deck:state': report(); break;
    }
  });

  // Forward navigation keys up to the deck, and stop this slide's own
  // document-level handler from acting on them too (capture phase wins).
  window.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var t = ev.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if ((ev.key === ' ' || ev.key === 'Enter') && t && t.tagName === 'BUTTON') return;
    if (!NAV[ev.key]) return;
    ev.preventDefault();
    ev.stopImmediatePropagation();
    send({ type: 'slide:key', key: ev.key });
  }, true);

  // Keep the deck in sync when the slide's own buttons are clicked.
  [next, prev, play, reset].forEach(function (b) {
    if (b) b.addEventListener('click', reportSoon);
  });

  window.addEventListener('load', function () {
    window.dispatchEvent(new Event('resize'));
    reportSoon();
  });

  send({ type: 'slide:ready' });
  report();
})();
</script>
</body>
</html>
